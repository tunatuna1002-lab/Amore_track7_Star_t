{% extends "base.html" %}

{% block title %}순위 목록 - LANEIGE Ranking Dashboard{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">순위 목록</h1>
            <p class="text-gray-500 mt-1">전체 랭킹 데이터 조회</p>
        </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl shadow-sm p-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">마켓</label>
                <select id="filterMarket" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-laneige-500 focus:border-laneige-500">
                    <option value="">전체</option>
                    <option value="amazon_us">Amazon US</option>
                    <option value="cosme_jp">@cosme Japan</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">브랜드</label>
                <input type="text" id="filterBrand" placeholder="예: LANEIGE" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-laneige-500 focus:border-laneige-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">최대 표시</label>
                <select id="filterLimit" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-laneige-500 focus:border-laneige-500">
                    <option value="50">50개</option>
                    <option value="100" selected>100개</option>
                    <option value="200">200개</option>
                    <option value="500">500개</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="loadRankings()" 
                        class="w-full px-4 py-2 bg-laneige-600 text-white font-medium rounded-lg hover:bg-laneige-700 transition-colors">
                    조회
                </button>
            </div>
        </div>
    </div>

    <!-- Results Count -->
    <div class="flex justify-between items-center">
        <p class="text-gray-600">
            총 <span id="resultCount" class="font-bold text-laneige-600">0</span>개 결과
        </p>
        <button onclick="exportData()" class="text-sm text-laneige-600 hover:text-laneige-800">
            📥 CSV 다운로드
        </button>
    </div>

    <!-- Rankings Table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('date_kst')">
                            날짜 ↕
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">마켓</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">카테고리</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">제품명</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">브랜드</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortBy('rank')">
                            순위 ↕
                        </th>
                    </tr>
                </thead>
                <tbody id="rankingsTableBody" class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                            <div class="loading">데이터 로딩 중...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    let currentData = [];
    let sortColumn = 'date_kst';
    let sortDirection = 'desc';

    async function loadRankings() {
        const market = document.getElementById('filterMarket').value;
        const brand = document.getElementById('filterBrand').value;
        const limit = document.getElementById('filterLimit').value;

        let url = `/api/rankings?limit=${limit}`;
        if (market) url += `&market=${market}`;
        if (brand) url += `&brand=${encodeURIComponent(brand)}`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            if (data.success) {
                currentData = data.data;
                document.getElementById('resultCount').textContent = currentData.length;
                renderTable();
            }
        } catch (error) {
            console.error('Error loading rankings:', error);
        }
    }

    function sortBy(column) {
        if (sortColumn === column) {
            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            sortColumn = column;
            sortDirection = 'asc';
        }
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('rankingsTableBody');

        if (!currentData || currentData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">데이터가 없습니다</td></tr>';
            return;
        }

        // Sort data
        const sorted = [...currentData].sort((a, b) => {
            let aVal = a[sortColumn];
            let bVal = b[sortColumn];

            if (sortColumn === 'rank') {
                aVal = parseInt(aVal) || 999;
                bVal = parseInt(bVal) || 999;
            }

            if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
            if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
            return 0;
        });

        tbody.innerHTML = sorted.map(row => `
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${row.date_kst || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 py-1 text-xs font-medium rounded-full ${
                        row.market === 'amazon_us' ? 'bg-orange-100 text-orange-800' : 'bg-pink-100 text-pink-800'
                    }">
                        ${row.market === 'amazon_us' ? 'Amazon US' : '@cosme'}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${row.category_key || '-'}</td>
                <td class="px-6 py-4 text-sm text-gray-900 max-w-md">
                    <a href="${row.product_url || '#'}" target="_blank" class="hover:text-laneige-600 hover:underline">
                        ${(row.product_name_raw || '-').substring(0, 60)}${(row.product_name_raw || '').length > 60 ? '...' : ''}
                    </a>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium ${
                    (row.brand_raw || '').toLowerCase().includes('laneige') ? 'text-laneige-600' : 'text-gray-500'
                }">${row.brand_raw || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold ${
                        row.rank === 1 ? 'bg-yellow-100 text-yellow-800' :
                        row.rank <= 3 ? 'bg-green-100 text-green-800' :
                        row.rank <= 10 ? 'bg-blue-100 text-blue-800' :
                        'bg-gray-100 text-gray-800'
                    }">
                        ${row.rank === 1 ? '🏆 ' : ''}#${row.rank}
                    </span>
                </td>
            </tr>
        `).join('');
    }

    function exportData() {
        if (!currentData || currentData.length === 0) {
            alert('내보낼 데이터가 없습니다.');
            return;
        }

        const headers = ['date_kst', 'market', 'category_key', 'product_name_raw', 'brand_raw', 'rank'];
        const csv = [
            headers.join(','),
            ...currentData.map(row => 
                headers.map(h => `"${(row[h] || '').toString().replace(/"/g, '""')}"`).join(',')
            )
        ].join('\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `rankings_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
    }

    // Load on page load
    document.addEventListener('DOMContentLoaded', loadRankings);
</script>
{% endblock %}
