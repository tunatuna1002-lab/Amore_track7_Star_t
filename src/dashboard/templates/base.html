<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LANEIGE Ranking Dashboard{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'laneige': {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#b9e5fe',
                            300: '#7cd4fd',
                            400: '#36bffa',
                            500: '#0ca5eb',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center">
                        <span class="text-2xl font-bold text-laneige-600">LANEIGE</span>
                        <span class="ml-2 text-gray-500 text-sm">Ranking Dashboard</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if request.path == '/' %}text-laneige-600 bg-laneige-50{% else %}text-gray-600 hover:text-laneige-600{% endif %}">
                        대시보드
                    </a>
                    <a href="/rankings" class="px-3 py-2 rounded-md text-sm font-medium {% if request.path == '/rankings' %}text-laneige-600 bg-laneige-50{% else %}text-gray-600 hover:text-laneige-600{% endif %}">
                        순위
                    </a>
                    <a href="/insights" class="px-3 py-2 rounded-md text-sm font-medium {% if request.path == '/insights' %}text-laneige-600 bg-laneige-50{% else %}text-gray-600 hover:text-laneige-600{% endif %}">
                        인사이트
                    </a>
                    <a href="/query" class="px-3 py-2 rounded-md text-sm font-medium {% if request.path == '/query' %}text-laneige-600 bg-laneige-50{% else %}text-gray-600 hover:text-laneige-600{% endif %}">
                        AI 질문
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-center text-gray-500 text-sm">
                © 2024 LANEIGE Ranking Collector - Graph-RAG System
            </p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
